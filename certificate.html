<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubinta Shahaadada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-emerald-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">Safarka Tafsiirka Qur'aanka</h1>
            <a href="index.html" class="text-xs bg-emerald-700 px-3 py-1.5 rounded">&larr; Bogga Hore</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 flex-grow max-w-md text-center">
        <h2 class="text-2xl font-bold text-emerald-900 mb-4">Hubinta Shahaadada</h2>
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">
            <input type="text" id="certSearch" placeholder="Geli Certificate Code-ka" class="w-full px-3 py-2 border rounded text-sm uppercase">
            <button onclick="checkCert();" class="w-full bg-emerald-800 text-white font-bold py-2 rounded text-sm">Hubi Shahaadada</button>
        </div>

        <div id="certCard" class="hidden mt-6 bg-white p-6 rounded-xl shadow-xl border-4 border-yellow-500">
            <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">✅ SHAHAADO SHAQAYNASA</span>
            <h3 class="text-xl font-bold text-emerald-900 mt-3">Safarka Tafsiirka Qur'aanka</h3>
            <p class="text-xs text-gray-500 my-2">Waxaa la siiyay ardayga:</p>
            <h4 id="certNameDisplay" class="text-xl font-bold text-gray-900 underline">---</h4>
            <p class="text-xs text-gray-600 mt-2">Darajada: <strong class="text-emerald-800">Mumtaaz (A+)</strong></p>
        </div>
    </div>

    <script>
        function checkCert() {
            document.getElementById('certNameDisplay').innerText = "Cabdiraxmaan Axmed Cali";
            document.getElementById('certCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
