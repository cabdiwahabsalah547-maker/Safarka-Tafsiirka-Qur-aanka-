<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xogta Ardayga - Safarka Tafsiirka Qur'aanka</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-emerald-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">Safarka Tafsiirka Qur'aanka</h1>
            <a href="index.html" class="text-xs bg-emerald-700 px-3 py-1.5 rounded hover:bg-emerald-600">&larr; Bogga Hore</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 flex-grow max-w-md">
        <div class="bg-white p-6 rounded-xl shadow border mb-6">
            <h2 class="text-xl font-bold text-emerald-900 text-center mb-4">Eeg Xogtaada Ardaynimo</h2>
            <form onsubmit="event.preventDefault(); findStudent();" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">Student Code</label>
                    <input type="text" id="searchCode" required placeholder="Tusaale: STQ001" class="w-full px-3 py-2 border rounded text-sm uppercase">
                </div>
                <button type="submit" class="w-full bg-emerald-800 text-white font-bold py-2 rounded text-sm">Raadi</button>
            </form>
        </div>

        <div id="profileResult" class="hidden bg-white p-6 rounded-xl shadow border border-emerald-200 space-y-3 text-sm">
            <div class="text-center border-b pb-3">
                <h3 id="resName" class="text-lg font-bold text-gray-900">---</h3>
                <span id="resCode" class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">---</span>
            </div>
            <div class="flex justify-between border-b pb-1 text-xs">
                <span class="text-gray-500">Nambarka WhatsApp:</span>
                <strong id="resPhone">---</strong>
            </div>
            <div class="flex justify-between border-b pb-1 text-xs">
                <span class="text-gray-500">Jinsiga:</span>
                <strong id="resGender">---</strong>
            </div>
        </div>
    </div>

    <script>
        function findStudent() {
            const codeInput = document.getElementById('searchCode').value.toUpperCase();
            const students = JSON.parse(localStorage.getItem('registeredStudents') || '[]');
            const found = students.find(s => s.code.toUpperCase() === codeInput);

            if(found) {
                document.getElementById('resName').innerText = found.name;
                document.getElementById('resCode').innerText = found.code;
                document.getElementById('resPhone').innerText = found.phone;
                document.getElementById('resGender').innerText = found.gender;
                document.getElementById('profileResult').classList.remove('hidden');
            } else {
                alert("Student Code-kan e-diiwaangashana ma aha!");
            }
        }
    </script>
</body>
</html>
