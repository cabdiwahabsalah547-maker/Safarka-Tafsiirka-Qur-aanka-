<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeybta Maamulka - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-emerald-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">🔒 Dashboard-ka Maamulka</h1>
            <a href="index.html" class="text-xs bg-emerald-800 px-3 py-1.5 rounded">&larr; Bogga Hore</a>
        </div>
    </nav>

    <!-- LOGIN SECTION -->
    <div id="adminLoginSection" class="container mx-auto px-4 py-16 max-w-md">
        <div class="bg-white p-6 rounded-xl shadow border">
            <h2 class="text-xl font-bold text-center text-emerald-900 mb-4">Gali Maamulka</h2>
            <form onsubmit="event.preventDefault(); adminLogin();" class="space-y-3">
                <input type="text" id="admUser" placeholder="Username" required class="w-full px-3 py-2 border rounded text-sm">
                <input type="password" id="admPass" placeholder="Password" required class="w-full px-3 py-2 border rounded text-sm">
                <button type="submit" class="w-full bg-emerald-900 text-white font-bold py-2 rounded text-sm">Soo Gal</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD PANEL -->
    <div id="adminPanel" class="hidden container mx-auto px-4 py-8 max-w-4xl space-y-6">

        <!-- TABS -->
        <div class="flex gap-2 overflow-x-auto pb-2 text-xs font-bold">
            <button onclick="openTab('studentsListTab')" class="bg-emerald-800 text-white px-4 py-2 rounded">👨‍🎓 Ardayda Diiwaangashan</button>
            <button onclick="openTab('createExamTab')" class="bg-emerald-800 text-white px-4 py-2 rounded">📝 Imtixaan Gali</button>
            <button onclick="openTab('gradeExamTab')" class="bg-emerald-800 text-white px-4 py-2 rounded">✍️ Natiijooyinka Imtixaanka</button>
            <button onclick="openTab('settingsTab')" class="bg-emerald-800 text-white px-4 py-2 rounded">🎨 Baddal Midabka & Settings</button>
        </div>

        <!-- TAB 1: ARDAYDA DIIWAANGASHAN -->
        <div id="studentsListTab" class="tab-box bg-white p-6 rounded-xl shadow border">
            <h3 class="font-bold text-emerald-900 mb-4 border-b pb-2">Liiska Ardayda Is-diiwaangelisay</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left border">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="p-2 border">Code</th>
                            <th class="p-2 border">Magaca</th>
                            <th class="p-2 border">WhatsApp</th>
                            <th class="p-2 border">Jinsiga</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: IMTIXAAN GALI (CREATE EXAM WITH 4 OPTIONS) -->
        <div id="createExamTab" class="tab-box hidden bg-white p-6 rounded-xl shadow border space-y-4">
            <h3 class="font-bold text-emerald-900 border-b pb-2">Abuur Imtixaan Cusub</h3>
            <div>
                <label class="block text-xs font-semibold mb-1">Cinwaanka Imtixaanka</label>
                <input type="text" id="newExamTitle" placeholder="Tusaale: Imtixaanka Tafsiirka Suratu Al-Baqarah" class="w-full px-3 py-2 border rounded text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Nidaamka Saxida (Grading Type)</label>
                <select id="newExamGrading" class="w-full px-3 py-2 border rounded text-sm">
                    <option value="auto">Automatic (Otomaatig u sax su'aalaha Circle-ka ah)</option>
                    <option value="manual">Manual (Aniga ayaa gacanta ka saxaya)</option>
                </select>
            </div>
            
            <div class="border-t pt-3">
                <h4 class="font-bold text-xs mb-2 text-emerald-900">Su'aalaha Ku Jira Imtixaanka:</h4>
                <div id="addedQuestionsBox" class="space-y-2 mb-4"></div>

                <!-- FORM-KA SSU'AAL CUSUB -->
                <div class="bg-emerald-50 p-4 border border-emerald-200 rounded-xl space-y-3">
                    <h5 class="font-bold text-xs text-emerald-800">Ku Dar Su'aal Cusub:</h5>
                    
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">Nooca Su'aasha</label>
                        <select id="qType" onchange="toggleOptionInputs();" class="w-full px-3 py-1.5 border rounded text-xs bg-white">
                            <option value="mcq">Circle / Dooro 4-ta Option (A, B, C, D)</option>
                            <option value="essay">Qoraal Banaan (Su'aal Toos Ah)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold mb-1">Qoraalka Su'aasha</label>
                        <input type="text" id="qText" placeholder="Qor su'aasha halkan..." class="w-full px-3 py-1.5 border rounded text-xs bg-white">
                    </div>

                    <!-- AFARTA OPTION (A, B, C, D) -->
                    <div id="mcqOptionsBox" class="grid grid-cols-1 md:grid-cols-2 gap-2 pt-2">
                        <div>
                            <label class="block text-[10px] text-gray-600">Option A:</label>
                            <input type="text" id="optA" placeholder="Jawaabta A" class="w-full px-2 py-1 border rounded text-xs bg-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-600">Option B:</label>
                            <input type="text" id="optB" placeholder="Jawaabta B" class="w-full px-2 py-1 border rounded text-xs bg-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-600">Option C:</label>
                            <input type="text" id="optC" placeholder="Jawaabta C" class="w-full px-2 py-1 border rounded text-xs bg-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-600">Option D:</label>
                            <input type="text" id="optD" placeholder="Jawaabta D" class="w-full px-2 py-1 border rounded text-xs bg-white">
                        </div>
                    </div>

                    <!-- JAWAABTA SAXDA AH -->
                    <div id="correctAnswerBox" class="pt-2">
                        <label class="block text-[11px] font-bold text-emerald-900 mb-1">Kiama Jawbaabta Saxda ah?</label>
                        <input type="text" id="qCorrect" placeholder="Geli qoraalka jawaabta saxda ah si toos ah" class="w-full px-3 py-1.5 border rounded text-xs bg-white">
                    </div>

                    <button type="button" onclick="addQuestionToExam();" class="w-full bg-blue-600 text-white font-bold py-2 rounded text-xs hover:bg-blue-700 shadow">
                        + Ku Dar Su'aashan Imtixaanka
                    </button>
                </div>
            </div>

            <button onclick="publishExam();" class="w-full bg-emerald-800 text-white font-bold py-3 rounded-lg shadow hover:bg-emerald-900 transition">
                🚀 Fasax / Fur Imtixaanka Ardayda
            </button>
        </div>

        <!-- TAB 3: NATIIJOOYINKA -->
        <div id="gradeExamTab" class="tab-box hidden bg-white p-6 rounded-xl shadow border">
            <h3 class="font-bold text-emerald-900 mb-4 border-b pb-2">Imtixanaadka Ardaydu Dhiibteen</h3>
            <div id="pendingExamsList" class="space-y-3 text-xs"></div>
        </div>

        <!-- TAB 4: SETTINGS -->
        <div id="settingsTab" class="tab-box hidden bg-white p-6 rounded-xl shadow border space-y-4">
            <h3 class="font-bold text-emerald-900 border-b pb-2">Badalida Midabada & Qeybta Link/PDF</h3>
            <div>
                <label class="block text-xs font-semibold mb-1">Midabka Website-ka</label>
                <select id="colorSelect" class="w-full px-3 py-1.5 border rounded text-xs">
                    <option value="emerald">Cagaar (Emerald)</option>
                    <option value="blue">Buluug (Blue)</option>
                    <option value="purple">Sogal (Purple)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Warbixinta Bogga Hore (Description)</label>
                <textarea id="descInput" rows="2" class="w-full px-3 py-1.5 border rounded text-xs" placeholder="Qor warbixin cusub..."></textarea>
            </div>
            <button onclick="saveSiteSettings();" class="bg-emerald-800 text-white font-bold text-xs px-4 py-2 rounded">Kaydi Baddalida</button>
        </div>

    </div>

    <script>
        function adminLogin() {
            const u = document.getElementById('admUser').value;
            const p = document.getElementById('admPass').value;
            if(u === 'admin' && p === '1234') {
                document.getElementById('adminLoginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadStudentsTable();
                loadSubmissions();
            } else {
                alert("Username ama Password xaqiijin la'aan!");
            }
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-box').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        function loadStudentsTable() {
            const students = JSON.parse(localStorage.getItem('registeredStudents') || '[]');
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            students.forEach(s => {
                tbody.innerHTML += `<tr><td class="p-2 border font-bold text-emerald-800">${s.code}</td><td class="p-2 border">${s.name}</td><td class="p-2 border">${s.phone}</td><td class="p-2 border">${s.gender}</td></tr>`;
            });
        }

        function toggleOptionInputs() {
            const type = document.getElementById('qType').value;
            if(type === 'mcq') {
                document.getElementById('mcqOptionsBox').classList.remove('hidden');
            } else {
                document.getElementById('mcqOptionsBox').classList.add('hidden');
            }
        }

        let currentQuestions = [];
        function addQuestionToExam() {
            const text = document.getElementById('qText').value.trim();
            const type = document.getElementById('qType').value;
            const correct = document.getElementById('qCorrect').value.trim();

            if(!text) return alert("Fadlan qor su'aasha!");

            let options = [];
            if(type === 'mcq') {
                const a = document.getElementById('optA').value.trim();
                const b = document.getElementById('optB').value.trim();
                const c = document.getElementById('optC').value.trim();
                const d = document.getElementById('optD').value.trim();

                if(!a || !b || !c || !d) {
                    return alert("Fadlan buuxi dhammaan 4-ta Option (A, B, C, D)!");
                }
                options = [a, b, c, d];
            }

            currentQuestions.push({ text, type, options, correct });

            // Muuji su'aaha la add-gareeyay
            const box = document.getElementById('addedQuestionsBox');
            box.innerHTML += `
                <div class="p-2 bg-gray-50 border rounded text-xs space-y-1">
                    <p class="font-bold text-emerald-900">${currentQuestions.length}. ${text}</p>
                    ${type === 'mcq' ? `<p class="text-gray-500">Options: A: ${options[0]} | B: ${options[1]} | C: ${options[2]} | D: ${options[3]}</p>` : '<p class="text-gray-500">Nooca: Qoraal Banaan</p>'}
                    <p class="text-green-700 font-semibold">Jawaabta Saxda ah: ${correct}</p>
                </div>
            `;

            // Reset inputs
            document.getElementById('qText').value = '';
            document.getElementById('optA').value = '';
            document.getElementById('optB').value = '';
            document.getElementById('optC').value = '';
            document.getElementById('optD').value = '';
            document.getElementById('qCorrect').value = '';
        }

        function publishExam() {
            const title = document.getElementById('newExamTitle').value.trim();
            const gradingType = document.getElementById('newExamGrading').value;

            if(!title || currentQuestions.length === 0) {
                return alert("Fadlan qor cinwaanka imtixaanka oo ku dar ugu dambeyn 1 su'aal!");
            }

            const examData = {
                title,
                gradingType,
                questions: currentQuestions,
                isOpen: true
            };

            localStorage.setItem('activeExam', JSON.stringify(examData));
            alert("🎉 Imtixaanka cusub si guul leh ayaa loo fasaxay oo uu furan yahay!");
            currentQuestions = [];
            document.getElementById('addedQuestionsBox').innerHTML = '';
            document.getElementById('newExamTitle').value = '';
        }

        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('examSubmissions') || '[]');
            const list = document.getElementById('pendingExamsList');
            if(submissions.length === 0) {
                list.innerHTML = `<p class="text-gray-500">Weli ma jiro arday imtixaan dhiibay.</p>`;
                return;
            }

            list.innerHTML = '';
            submissions.forEach((s, idx) => {
                list.innerHTML += `
                    <div class="p-3 bg-gray-50 border rounded-lg space-y-1">
                        <div class="flex justify-between items-center">
                            <strong class="text-emerald-900">Student Code: ${s.code}</strong>
                            <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">${s.status}</span>
                        </div>
                        <p class="text-gray-600">Natiijada Otomaatiga ah: <strong>${s.autoScore} / ${s.totalQuestions}</strong></p>
                    </div>
                `;
            });
        }

        function saveSiteSettings() {
            const color = document.getElementById('colorSelect').value;
            const desc = document.getElementById('descInput').value;

            localStorage.setItem('siteColor', color);
            localStorage.setItem('siteDesc', desc);

            alert("Baddalida website-ka waa la kaydiyay!");
        }
    </script>
</body>
</html>
